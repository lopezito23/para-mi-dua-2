<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Hello Kitty ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:#fff;
    color:#8b5a83;
}

/* =====================================================
   FONDO
===================================================== */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,190,220,.55),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 25%,
            rgba(220,200,255,.45),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(255,215,235,.5),
            transparent 35%
        ),
        #fff;
    z-index:-10;
}

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    animation:moveGlow 12s ease-in-out infinite alternate;
}

.glow.one{
    background:#ff9dcc;
    top:-180px;
    left:-120px;
}

.glow.two{
    background:#c7b5ff;
    right:-180px;
    top:20%;
    animation-delay:-4s;
}

.glow.three{
    background:#8edfff;
    bottom:-220px;
    left:25%;
    animation-delay:-7s;
}

@keyframes moveGlow{
    0%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(80px,50px) scale(1.15);
    }

    100%{
        transform:translate(-40px,100px) scale(.9);
    }
}

/* =====================================================
   PARTÍCULAS
===================================================== */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
}

.particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ff9dcc;
    opacity:.5;
    animation:particleFloat linear infinite;
}

@keyframes particleFloat{

    from{
        transform:
            translateY(110vh)
            scale(.5);
        opacity:0;
    }

    15%{
        opacity:.7;
    }

    85%{
        opacity:.7;
    }

    to{
        transform:
            translateY(-20vh)
            scale(1.2);
        opacity:0;
    }
}

/* =====================================================
   DESTELLOS
===================================================== */

.sparkle{
    position:fixed;
    width:8px;
    height:8px;
    pointer-events:none;
    z-index:2;
}

.sparkle::before,
.sparkle::after{
    content:"";
    position:absolute;
    background:white;
    border-radius:20px;
}

.sparkle::before{
    width:2px;
    height:100%;
    left:3px;
}

.sparkle::after{
    height:2px;
    width:100%;
    top:3px;
}

.sparkle{
    animation:sparkleAnim 2s ease-in-out infinite;
}

@keyframes sparkleAnim{

    0%,100%{
        transform:
            scale(.2)
            rotate(0);
        opacity:0;
    }

    50%{
        transform:
            scale(1.5)
            rotate(45deg);
        opacity:1;
    }
}

/* =====================================================
   CONTENEDOR
===================================================== */

.container{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:5;
}

/* =====================================================
   HELLO KITTY
===================================================== */

.drawing-area{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.hello-kitty-svg{
    width:min(390px,85vw);
    height:min(390px,85vw);
    transition:
        transform .4s ease,
        filter .4s ease;

    filter:
        drop-shadow(
            0 20px 35px
            rgba(255,100,170,.18)
        );
}

.hello-kitty-svg:hover{
    transform:scale(1.025);

    filter:
        drop-shadow(
            0 25px 45px
            rgba(255,80,160,.3)
        );
}

.main-outline{
    stroke:#000;
    stroke-width:3;
    fill:none;
    stroke-dasharray:1500;
    stroke-dashoffset:1500;

    animation:
        drawOutline 3s ease-in-out .5s forwards;
}

.face{
    fill:#fff;
    stroke:#000;
    stroke-width:2;
    stroke-dasharray:1200;
    stroke-dashoffset:1200;
    fill-opacity:0;

    animation:
        drawFace 2s ease-in-out 3.5s forwards;
}

.bow{
    fill:#cc2229;
    stroke:#000;
    stroke-width:1.5;
    stroke-dasharray:600;
    stroke-dashoffset:600;
    fill-opacity:0;

    animation:
        drawBow 1.5s ease-in-out 5.5s forwards;
}

.bow-detail{
    fill:#cc2229;
    stroke:#000;
    stroke-width:1.5;
    stroke-dasharray:500;
    stroke-dashoffset:500;
    fill-opacity:0;

    animation:
        drawBow 1s ease-in-out 6.2s forwards;
}

.bow-center{
    fill:#cc2229;
    animation:fade .5s 7s forwards;
}

.eye-left,
.eye-right,
.nose{
    fill:#000;
    animation:fade .6s 7.5s forwards;
}

.nose-inner{
    fill:#f2c831;
    animation:fade .3s 8.2s forwards;
}

.whisker-left-1,
.whisker-left-2,
.whisker-left-3,
.whisker-right-1,
.whisker-right-2,
.whisker-right-3{
    stroke:#000;
    stroke-width:2;
    stroke-linecap:round;
    stroke-dasharray:50;
    stroke-dashoffset:50;

    animation:
        whisker .7s ease forwards;
}

.whisker-left-1{
    animation-delay:8.5s;
}

.whisker-left-2{
    animation-delay:8.7s;
}

.whisker-left-3{
    animation-delay:8.9s;
}

.whisker-right-1{
    animation-delay:9.1s;
}

.whisker-right-2{
    animation-delay:9.3s;
}

.whisker-right-3{
    animation-delay:9.5s;
}

@keyframes drawOutline{

    0%{
        stroke-dashoffset:1500;
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        stroke-dashoffset:0;
        opacity:1;
    }
}

@keyframes drawFace{

    0%{
        stroke-dashoffset:1200;
        fill-opacity:0;
    }

    70%{
        stroke-dashoffset:0;
        fill-opacity:0;
    }

    100%{
        stroke-dashoffset:0;
        fill-opacity:1;
    }
}

@keyframes drawBow{

    0%{
        stroke-dashoffset:600;
        fill-opacity:0;
    }

    70%{
        stroke-dashoffset:0;
        fill-opacity:0;
    }

    100%{
        stroke-dashoffset:0;
        fill-opacity:1;
    }
}

@keyframes fade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

@keyframes whisker{

    from{
        stroke-dashoffset:50;
        opacity:0;
    }

    to{
        stroke-dashoffset:0;
        opacity:1;
    }
}

/* =====================================================
   BOTÓN PRINCIPAL
===================================================== */

.continue-btn{
    margin-top:10px;

    padding:14px 34px;

    border:1px solid
        rgba(255,80,160,.35);

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #ff74b5,
            #ff9dcc
        );

    color:#fff;

    font-family:'Poppins',sans-serif;

    font-size:16px;

    font-weight:600;

    letter-spacing:.5px;

    cursor:pointer;

    box-shadow:
        0 10px 30px
        rgba(255,80,160,.25);

    opacity:0;

    transform:
        translateY(20px)
        scale(.95);

    transition:.3s ease;

    animation:
        buttonPulse 2s
        ease-in-out infinite;
}

.continue-btn:hover{

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 15px 40px
        rgba(255,80,160,.35);
}

.continue-btn:active{

    transform:scale(.95);
}

@keyframes buttonPulse{

    0%,100%{
        box-shadow:
            0 10px 30px
            rgba(255,80,160,.2);
    }

    50%{
        box-shadow:
            0 10px 40px
            rgba(255,80,160,.45);
    }
}

/* =====================================================
   CONTROL DE MÚSICA
===================================================== */

.music-control{

    position:fixed;

    top:18px;
    left:18px;

    z-index:3000;

    display:flex;
    align-items:center;

    gap:8px;

    padding:8px 12px;

    border-radius:50px;

    background:
        rgba(255,255,255,.8);

    border:
        1px solid
        rgba(255,120,180,.2);

    backdrop-filter:blur(15px);

    box-shadow:
        0 10px 30px
        rgba(150,70,130,.12);
}

.music-button{

    width:35px;
    height:35px;

    border:none;
    border-radius:50%;

    background:#fff;

    cursor:pointer;

    font-size:18px;

    transition:.25s ease;
}

.music-button:hover{
    transform:scale(1.08);
}

.music-status{

    color:#8b5a83;

    font-size:11px;

    white-space:nowrap;
}

.volume-slider{

    width:65px;

    accent-color:#ff73b2;
}

/* =====================================================
   PANTALLA ROMÁNTICA
===================================================== */

.romantic-message{

    position:fixed;

    inset:0;

    z-index:2000;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.98),
            rgba(255,245,250,.94)
        );

    opacity:0;

    visibility:hidden;

    transform:scale(1.05);

    transition:
        opacity .55s ease,
        transform .55s ease,
        visibility .55s;
}

.romantic-message.show{

    opacity:1;

    visibility:visible;

    transform:scale(1);
}

.romantic-message::before{

    content:"";

    position:absolute;

    inset:15px;

    border:
        1px solid
        rgba(255,130,190,.18);

    border-radius:30px;

    box-shadow:
        inset 0 0 80px
        rgba(255,170,210,.12),

        0 0 80px
        rgba(255,170,210,.12);

    pointer-events:none;
}

/* =====================================================
   FRASE
===================================================== */

.romantic-text{

    position:relative;

    z-index:10;

    max-width:min(900px,90vw);

    min-height:115px;

    padding:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    font-family:
        'Dancing Script',
        cursive;

    font-size:
        clamp(
            2rem,
            5vw,
            4rem
        );

    font-weight:600;

    line-height:1.25;

    color:#8b5a83;

    text-shadow:
        0 3px 15px
        rgba(200,100,160,.12);

    transition:
        opacity .35s ease,
        transform .35s ease;
}

.typing-cursor{

    width:3px;

    height:1em;

    display:inline-block;

    margin-left:5px;

    background:#ff70ae;

    animation:
        cursorBlink .6s infinite;
}

@keyframes cursorBlink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:0;
    }
}

/* =====================================================
   SUBTÍTULO
===================================================== */

.romantic-subtitle{

    position:relative;

    z-index:10;

    margin-top:5px;

    font-size:
        clamp(
            .8rem,
            2vw,
            1.1rem
        );

    letter-spacing:2px;

    color:#b27ba4;

    animation:
        subtitleFloat
        3s
        ease-in-out
        infinite;
}

@keyframes subtitleFloat{

    0%,100%{
        transform:translateY(0);
        opacity:.7;
    }

    50%{
        transform:translateY(-4px);
        opacity:1;
    }
}

/* =====================================================
   MENSAJE FINAL
===================================================== */

.final-message{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:20px;

    animation:
        finalMessage
        .9s
        ease forwards;
}

.final-heart{

    font-size:
        clamp(
            45px,
            8vw,
            80px
        );

    animation:
        finalHeart
        1.5s
        ease-in-out
        infinite;
}

.final-title{

    font-family:
        'Dancing Script',
        cursive;

    font-size:
        clamp(
            2rem,
            5vw,
            4rem
        );

    color:#8b5a83;

    text-align:center;

    line-height:1.2;
}

.final-small{

    font-family:'Poppins',sans-serif;

    font-size:
        clamp(
            .8rem,
            2vw,
            1rem
        );

    color:#b27ba4;

    text-align:center;

    letter-spacing:.5px;
}

.restart-btn{

    margin-top:8px;

    border:none;

    border-radius:50px;

    padding:12px 28px;

    font-family:'Poppins',sans-serif;

    font-weight:600;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff70ae,
            #ff9dcc
        );

    cursor:pointer;

    box-shadow:
        0 10px 30px
        rgba(255,100,170,.25);

    transition:.3s ease;
}

.restart-btn:hover{

    transform:
        translateY(-3px)
        scale(1.04);

    box-shadow:
        0 15px 40px
        rgba(255,100,170,.4);
}

.restart-btn:active{

    transform:scale(.95);
}

@keyframes finalMessage{

    0%{
        opacity:0;

        transform:
            translateY(25px)
            scale(.8);

        filter:blur(8px);
    }

    60%{

        opacity:1;

        transform:
            translateY(-3px)
            scale(1.05);

        filter:blur(0);
    }

    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}

@keyframes finalHeart{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }
}

/* =====================================================
   CERRAR
===================================================== */

.close-message{

    position:absolute;

    top:20px;
    right:25px;

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:
        rgba(255,255,255,.8);

    color:#9c6b91;

    font-size:27px;

    cursor:pointer;

    z-index:20;

    box-shadow:
        0 5px 20px
        rgba(150,80,130,.12);

    transition:.3s ease;
}

.close-message:hover{

    transform:
        rotate(90deg)
        scale(1.1);
}

/* =====================================================
   CORAZONES
===================================================== */

.hearts-container{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}

.heart{

    position:absolute;

    bottom:-30px;

    width:18px;
    height:18px;

    background:#ff78b7;

    transform:rotate(45deg);

    animation:
        heartFloat
        6s
        linear
        infinite;

    opacity:0;
}

.heart::before,
.heart::after{

    content:"";

    position:absolute;

    width:18px;
    height:18px;

    background:inherit;

    border-radius:50%;
}

.heart::before{

    top:-9px;
    left:0;
}

.heart::after{

    left:-9px;
    top:0;
}

.heart:nth-child(1){
    left:5%;
    animation-delay:0s;
}

.heart:nth-child(2){
    left:15%;
    animation-delay:1.2s;
}

.heart:nth-child(3){
    left:28%;
    animation-delay:2.1s;
}

.heart:nth-child(4){
    left:40%;
    animation-delay:.6s;
}

.heart:nth-child(5){
    left:52%;
    animation-delay:3s;
}

.heart:nth-child(6){
    left:65%;
    animation-delay:1.8s;
}

.heart:nth-child(7){
    left:78%;
    animation-delay:3.7s;
}

.heart:nth-child(8){
    left:90%;
    animation-delay:2.7s;
}

.heart:nth-child(9){
    left:23%;
    animation-delay:4.2s;
}

.heart:nth-child(10){
    left:72%;
    animation-delay:5s;
}

@keyframes heartFloat{

    0%{

        transform:
            translateY(0)
            translateX(0)
            rotate(45deg)
            scale(.4);

        opacity:0;
    }

    15%{
        opacity:.8;
    }

    50%{

        transform:
            translateY(-45vh)
            translateX(35px)
            rotate(120deg)
            scale(1);
    }

    100%{

        transform:
            translateY(-110vh)
            translateX(-30px)
            rotate(220deg)
            scale(.4);

        opacity:0;
    }
}

/* =====================================================
   CÍRCULO DE BRILLO
===================================================== */

.romantic-ring{

    position:absolute;

    width:min(650px,90vw);
    height:min(650px,90vw);

    border-radius:50%;

    border:
        1px solid
        rgba(255,150,200,.12);

    box-shadow:
        0 0 100px
        rgba(255,140,195,.12);

    animation:
        ringPulse
        4s
        ease-in-out
        infinite;

    pointer-events:none;
}

@keyframes ringPulse{

    0%,100%{
        transform:scale(.95);
        opacity:.4;
    }

    50%{
        transform:scale(1.04);
        opacity:.8;
    }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    .music-control{

        top:10px;
        left:10px;

        padding:6px 8px;
    }

    .music-status{
        display:none;
    }

    .volume-slider{
        width:55px;
    }

    .hello-kitty-svg{

        width:85vw;
        height:85vw;
    }

    .continue-btn{

        margin-top:0;

        padding:12px 28px;
    }

    .romantic-text{

        max-width:94vw;

        min-height:130px;

        padding:15px;
    }

    .romantic-message::before{

        inset:8px;

        border-radius:20px;
    }

    .close-message{

        top:12px;
        right:12px;
    }
}

@media(max-height:650px){

    .hello-kitty-svg{

        width:min(280px,65vw);
        height:min(280px,65vw);
    }

    .continue-btn{
        margin-top:0;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     FONDO
===================================================== -->

<div class="background">

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div class="glow three"></div>

</div>

<div
    class="particles"
    id="particles"
></div>

<div
    class="sparkle"
    style="top:18%;left:12%;animation-delay:.2s"
></div>

<div
    class="sparkle"
    style="top:30%;right:15%;animation-delay:1s"
></div>

<div
    class="sparkle"
    style="top:70%;left:20%;animation-delay:1.6s"
></div>

<div
    class="sparkle"
    style="top:78%;right:20%;animation-delay:.7s"
></div>


<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="backgroundMusic"
    preload="auto"
    loop
    playsinline
>
    <source
        src="Ojitos_De_Miel.mp3"
        type="audio/mpeg"
    >

    Tu navegador no soporta audio HTML5.
</audio>


<!-- =====================================================
     CONTROL DE MÚSICA
===================================================== -->

<div
    class="music-control"
    id="musicControl"
>

    <button
        class="music-button"
        id="musicButton"
        title="Activar o desactivar música"
        aria-label="Música"
    >
        🔇
    </button>

    <span
        class="music-status"
        id="musicStatus"
    >
        Música apagada
    </span>

    <input
        class="volume-slider"
        id="volumeSlider"
        type="range"
        min="0"
        max="1"
        step=".01"
        value=".65"
        aria-label="Volumen"
    >

</div>


<!-- =====================================================
     PÁGINA PRINCIPAL
===================================================== -->

<div class="container">

    <div class="drawing-area">

        <svg
            class="hello-kitty-svg"
            viewBox="0 0 192.756 192.756"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                class="main-outline"

<!-- =====================================================
     PANTALLA DE FRASES
===================================================== -->

<div
    class="romantic-message"
    id="romanticMessage"
>

    <div class="romantic-ring"></div>


    <button
        class="close-message"
        onclick="closeMessage()"
        aria-label="Cerrar"
    >
        ×
    </button>


    <div
        class="romantic-text"
        id="typingText"
    ></div>


    <div
        class="romantic-subtitle"
        id="romanticSubtitle"
    >
        TE AMO MUCHO D... ✨
    </div>


    <div
        class="hearts-container"
    >

        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>

    </div>

</div>


<script>

/* =====================================================
   CREAR PARTÍCULAS
===================================================== */

const particles =
    document.getElementById(
        "particles"
    );

for(
    let i = 0;
    i < 28;
    i++
){

    const particle =
        document.createElement(
            "div"
        );

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        (
            7 +
            Math.random() * 9
        ) + "s";

    particle.style.animationDelay =
        (
            -Math.random() * 12
        ) + "s";

    const size =
        3 +
        Math.random() * 5;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    particles.appendChild(
        particle
    );
}


/* =====================================================
   ELEMENTOS
===================================================== */

const music =
    document.getElementById(
        "backgroundMusic"
    );

const musicButton =
    document.getElementById(
        "musicButton"
    );

const musicStatus =
    document.getElementById(
        "musicStatus"
    );

const volumeSlider =
    document.getElementById(
        "volumeSlider"
    );

const musicControl =
    document.getElementById(
        "musicControl"
    );

const continueBtn =
    document.getElementById(
        "continueBtn"
    );

const romanticMessage =
    document.getElementById(
        "romanticMessage"
    );

const typingText =
    document.getElementById(
        "typingText"
    );

const romanticSubtitle =
    document.getElementById(
        "romanticSubtitle"
    );


/* =====================================================
   MÚSICA
===================================================== */

const savedVolume =
    localStorage.getItem(
        "helloKittyVolume"
    );

if(
    savedVolume !== null
){

    volumeSlider.value =
        savedVolume;

    music.volume =
        Number(savedVolume);

}else{

    music.volume =
        .65;

}


async function playMusic(){

    try{

        await music.play();

        musicButton.textContent =
            "🔊";

        musicStatus.textContent =
            "Reproduciendo";

        musicControl.classList.add(
            "playing"
        );

        localStorage.setItem(
            "helloKittyMusic",
            "true"
        );

    }catch(error){

        musicButton.textContent =
            "▶️";

        musicStatus.textContent =
            "Toca para reproducir";

        console.log(
            "El navegador bloqueó la reproducción:",
            error
        );

    }

}


function pauseMusic(){

    music.pause();

    musicButton.textContent =
        "🔇";

    musicStatus.textContent =
        "Música apagada";

    musicControl.classList.remove(
        "playing"
    );

    localStorage.setItem(
        "helloKittyMusic",
        "false"
    );

}


musicButton.addEventListener(
    "click",
    async function(){

        if(
            music.paused
        ){

            await playMusic();

        }else{

            pauseMusic();

        }

    }
);


volumeSlider.addEventListener(
    "input",
    function(){

        music.volume =
            Number(this.value);

        localStorage.setItem(
            "helloKittyVolume",
            this.value
        );

    }
);


music.addEventListener(
    "play",
    function(){

        musicButton.textContent =
            "🔊";

        musicStatus.textContent =
            "Reproduciendo";

        musicControl.classList.add(
            "playing"
        );

    }
);


music.addEventListener(
    "pause",
    function(){

        musicButton.textContent =
            "🔇";

        musicStatus.textContent =
            "Música apagada";

        musicControl.classList.remove(
            "playing"
        );

    }
);


music.addEventListener(
    "error",
    function(){

        musicButton.textContent =
            "⚠️";

        musicStatus.textContent =
            "Canción no encontrada";

        console.error(
            "No se encontró Ojitos_De_Miel.mp3"
        );

    }
);


/* =====================================================
   FRASES
===================================================== */

const frases = [

    "Eres el sueño que nunca quiero despertar 🌙",

    "Tu sonrisa es mi lugar favorito ❤️",

    "Contigo todo se siente diferente 💕",

    "No necesito estrellas cuando tengo tu mirada ✨",

    "Eres esa persona que hace bonito cualquier día 🌷",

    "Mi corazón siempre elige encontrarte a ti 💗",

    "Si pudiera elegir otra vez, volvería a elegirte a ti ❤️",

    "Contigo hasta los días normales se sienten especiales 🥺💕",

    "Eres mi pensamiento favorito antes de dormir 🌙",

    "No sé cómo explicarlo, pero contigo todo se siente diferente 💞",

    "Me encanta coincidir contigo en esta vida ✨",

    "Quiero seguir creando recuerdos contigo para siempre 💖",

    "Tú haces que mi mundo sea un poquito más bonito 🌸",

    "Eres mi casualidad favorita ❤️",

    "A tu lado aprendí que el amor también puede sentirse como hogar 🏡💕",

    "Si el amor tuviera un nombre, tendría el tuyo 💗",

    "Me haces sonreír incluso cuando no estás conmigo 🥹❤️",

    "Ojalá pudiera guardar cada momento contigo para siempre ✨",

    "Mi lugar favorito siempre será a tu lado 💕",

    "Gracias por existir y formar parte de mi vida 🌹",

    "Entre tantas personas, mi corazón decidió encontrarte a ti ❤️",

    "Quiero que seas parte de mis mejores recuerdos 💖",

    "Eres mi pequeño pedacito de felicidad 🌷",

    "Contigo quiero ver pasar el tiempo sin preocuparme por nada 🌙",

    "Te elegiría en esta vida y en todas las que existan ❤️"

];


let fraseIndex = 0;

let typingTimer = null;

let phraseTimer = null;

let isOpen = false;

let finished = false;


/* =====================================================
   MOSTRAR BOTÓN
===================================================== */

setTimeout(
    function(){

        continueBtn.style.opacity =
            "1";

        continueBtn.style.transform =
            "translateY(0) scale(1)";

    },
    10000
);


/* =====================================================
   ABRIR
===================================================== */

continueBtn.addEventListener(
    "click",
    async function(){

        continueBtn.style.transform =
            "scale(.94)";

        setTimeout(
            function(){

                continueBtn.style.transform =
                    "scale(1)";

            },
            120
        );


        if(
            music.paused
        ){

            await playMusic();

        }


        openRomanticMessage();

    }
);


/* =====================================================
   ABRIR MENSAJES
===================================================== */

function openRomanticMessage(){

    isOpen = true;

    finished = false;

    fraseIndex = 0;

    romanticSubtitle.style.display =
        "block";

    romanticMessage.classList.add(
        "show"
    );

    clearTimeout(
        typingTimer
    );

    clearTimeout(
        phraseTimer
    );

    showPhrase();

}


/* =====================================================
   MOSTRAR FRASE
===================================================== */

function showPhrase(){

    if(
        !isOpen ||
        finished
    ){
        return;
    }


    clearTimeout(
        typingTimer
    );

    clearTimeout(
        phraseTimer
    );


    const phrase =
        frases[fraseIndex];


    typingText.innerHTML =
        "";


    typingText.style.opacity =
        "1";

    typingText.style.transform =
        "translateY(0) scale(1)";


    const cursor =
        document.createElement(
            "span"
        );

    cursor.className =
        "typing-cursor";


    typingText.appendChild(
        cursor
    );


    let index = 0;


    /*
     * VELOCIDAD DE ESCRITURA
     */

    const speed = 42;


    function type(){

        if(
            !isOpen ||
            finished
        ){
            return;
        }


        if(
            index < phrase.length
        ){

            const character =
                document.createTextNode(
                    phrase[index]
                );

            typingText.insertBefore(
                character,
                cursor
            );

            index++;


            typingTimer =
                setTimeout(
                    type,
                    speed
                );

        }else{

            /*
             * Esperar antes de
             * cambiar a la siguiente.
             */

            phraseTimer =
                setTimeout(
                    nextPhrase,
                    2700
                );

        }

    }


    typingTimer =
        setTimeout(
            type,
            150
        );

}


/* =====================================================
   SIGUIENTE FRASE
===================================================== */

function nextPhrase(){

    if(
        !isOpen ||
        finished
    ){
        return;
    }


    /*
     * AQUÍ DETECTAMOS
     * QUE YA SE ACABARON.
     */

    if(
        fraseIndex >=
        frases.length - 1
    ){

        showFinalMessage();

        return;

    }


    /*
     * Animación de salida
     */

    typingText.style.opacity =
        "0";

    typingText.style.transform =
        "translateY(12px) scale(.98)";


    setTimeout(
        function(){

            if(
                !isOpen ||
                finished
            ){
                return;
            }


            fraseIndex++;

            showPhrase();

        },
        350
    );

}


/* =====================================================
   MENSAJE FINAL
===================================================== */

function showFinalMessage(){

    finished = true;

    clearTimeout(
        typingTimer
    );

    clearTimeout(
        phraseTimer
    );


    typingText.style.opacity =
        "0";

    typingText.style.transform =
        "translateY(15px) scale(.95)";


    setTimeout(
        function(){

            if(!isOpen){
                return;
            }


            romanticSubtitle.style.display =
                "none";


            typingText.innerHTML = `

                <div class="final-message">

                    <div class="final-heart">
                        ❤️
                    </div>

                    <div class="final-title">
                        Y estas fueron todas<br>
                        las cosas que quería decirte...
                    </div>

                    <div class="final-small">
                        Pero todavía me quedan
                        muchísimas cosas por sentir contigo ✨
                    </div>

                    <button
                        class="restart-btn"
                        onclick="restartMessages(event)"
                    >
                        💗 VOLVER A EMPEZAR
                    </button>

                </div>

            `;


            typingText.style.opacity =
                "1";

            typingText.style.transform =
                "translateY(0) scale(1)";

        },
        400
    );

}


/* =====================================================
   VOLVER A EMPEZAR
===================================================== */

function restartMessages(event){

    /*
     * Evita que el click del botón
     * genere un efecto de destello
     * adicional.
     */

    if(event){
        event.stopPropagation();
    }


    clearTimeout(
        typingTimer
    );

    clearTimeout(
        phraseTimer
    );


    finished = false;

    fraseIndex = 0;


    romanticSubtitle.style.display =
        "block";


    typingText.style.opacity =
        "0";

    typingText.style.transform =
        "translateY(15px) scale(.95)";


    setTimeout(
        function(){

            if(!isOpen){
                return;
            }

            showPhrase();

        },
        350
    );

}


/* =====================================================
   CERRAR
===================================================== */

function closeMessage(){

    isOpen = false;

    finished = false;

    clearTimeout(
        typingTimer
    );

    clearTimeout(
        phraseTimer
    );

    romanticMessage.classList.remove(
        "show"
    );

}


/* =====================================================
   EFECTOS AL TOCAR
===================================================== */

romanticMessage.addEventListener(
    "click",
    function(event){

        if(
            event.target.classList.contains(
                "close-message"
            )
        ){
            return;
        }


        if(
            event.target.classList.contains(
                "restart-btn"
            )
        ){
            return;
        }


        createClickSparkle(
            event.clientX,
            event.clientY
        );

    }
);


function createClickSparkle(x,y){

    const sparkle =
        document.createElement(
            "div"
        );


    sparkle.style.position =
        "fixed";

    sparkle.style.left =
        x + "px";

    sparkle.style.top =
        y + "px";

    sparkle.style.width =
        "10px";

    sparkle.style.height =
        "10px";

    sparkle.style.borderRadius =
        "50%";

    sparkle.style.background =
        "#ff7bb8";

    sparkle.style.pointerEvents =
        "none";

    sparkle.style.zIndex =
        "9999";

    sparkle.style.boxShadow =
        "0 0 20px #ff7bb8";


    document.body.appendChild(
        sparkle
    );


    const animation =
        sparkle.animate(

            [

                {
                    transform:
                        "translate(-50%,-50%) scale(.2)",
                    opacity:1
                },

                {
                    transform:
                        "translate(-50%,-50%) scale(3)",
                    opacity:0
                }

            ],

            {
                duration:700,
                easing:"ease-out"
            }

        );


    animation.onfinish =
        function(){

            sparkle.remove();

        };

}


/* =====================================================
   CLICK EN HELLO KITTY
===================================================== */

const kitty =
    document.querySelector(
        ".hello-kitty-svg"
    );


kitty.addEventListener(
    "click",
    async function(){

        createClickSparkle(
            window.innerWidth / 2,
            window.innerHeight / 2
        );


        if(
            music.paused
        ){

            await playMusic();

        }

    }
);

</script>
